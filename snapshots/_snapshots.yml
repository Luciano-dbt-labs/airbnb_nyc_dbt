version: 2

snapshots:
  - name: host_snapshot
    description: >
      SCD2 history of host_name per host_id, using dbt's check strategy.
      dbt_valid_to is null for the currently active version of each host.
    columns:
      - name: host_id
        tests:
          - not_null
      - name: dbt_scd_id
        tests:
          - unique
          - not_null
